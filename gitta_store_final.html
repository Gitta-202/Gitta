<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gitta for chic baby</title>
<style>
:root{--pink:#ef8fb0;--blue:#8fb9dc;--ink:#222;--muted:#777;--line:#eee6e8;--bg:#fff9fb}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#fff5f8,#eef7fc);color:var(--ink)}
.app{min-height:100vh;background:var(--bg);border-radius:0}.top{max-width:1180px;margin:auto;padding:22px 24px;display:flex;align-items:center;justify-content:space-between}
.brand{font-family:Georgia,serif;font-size:31px;color:var(--pink);line-height:.9;text-align:center}.brand small{display:block;font:14px Georgia;color:#7aa4c6}
.icon{border:0;background:white;border-radius:50%;width:38px;height:38px;box-shadow:0 3px 12px #e8dce0;cursor:pointer}
.hero{max-width:1180px;margin:auto;padding:0 24px}.hero-card{background:linear-gradient(120deg,#ffe5ee,#f8edf4 55%,#e9f4fc);border-radius:22px;padding:32px;display:flex;align-items:center;justify-content:space-between;overflow:hidden;min-height:250px}
.hero h1{font:46px Georgia;margin:0;color:#7aa4c6}.hero p{color:#9b6675;font-size:18px}button.primary{border:0;background:var(--pink);color:white;border-radius:24px;padding:13px 25px;font-weight:700;cursor:pointer}
.section{max-width:1180px;margin:26px auto;padding:0 24px}.chips{display:flex;gap:12px;overflow:auto}.chip{min-width:105px;background:white;border:1px solid var(--line);border-radius:18px;padding:15px 10px;text-align:center;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 4px 14px #eadfe2}.card img{width:100%;height:165px;object-fit:cover;background:#f9eef1}.card .body{padding:12px}.price{font-weight:700;margin-top:7px}.heart{float:right;border:0;background:none;font-size:18px}
.nav{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;gap:70px;padding:12px;z-index:5}.nav button{border:0;background:none;color:#777;cursor:pointer}.nav button.active{color:var(--pink);font-weight:700}
.panel{display:none;max-width:1180px;margin:auto;padding:20px 24px}.panel.active{display:block}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
input,textarea{width:100%;padding:12px;border:1px solid #eadde1;border-radius:12px;margin:6px 0 12px}label{font-size:13px;color:#666}.admin-card{background:white;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 4px 12px #eee}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.product-row{display:flex;align-items:center;gap:12px;border-top:1px solid #eee;padding:12px 0}.product-row img{width:60px;height:60px;border-radius:12px;object-fit:cover}
@media(max-width:600px){.hero-card{min-height:230px;padding:24px}.hero h1{font-size:34px}.hero-card:after{content:"🎁";font-size:80px}.nav{gap:25px}.row{grid-template-columns:1fr}}
</style></head><body><div class="app">
<header class="top"><button class="icon" onclick="show('home')">☰</button><div class="brand">Gitta<small>for chic baby</small></div><div><button class="icon" onclick="show('products')">⌕</button><button class="icon" onclick="show('cart')">🛒</button></div></header>
<main id="home" class="panel active"><section class="hero"><div class="hero-card"><div><div style="font-size:34px">🎀</div><h1>Special Moments</h1><p>with a touch of love</p><button class="primary" onclick="show('products')">Shop Now</button></div><div style="font-size:120px">🧸</div></div></section>
<section class="section"><div class="chips"><div class="chip">🎁<br>Party Favors</div><div class="chip">🕯️<br>Candles</div><div class="chip">🎀<br>Gift Boxes</div><div class="chip">🧸<br>Custom Orders</div></div></section>
<section class="section"><div style="display:flex;justify-content:space-between"><h2>Featured Products</h2><button class="icon" onclick="show('products')">›</button></div><div id="featured" class="grid"></div></section></main>
<section id="products" class="panel"><div class="toolbar"><h2>Party Favors</h2><button class="primary" onclick="show('admin')">⚙ Manage</button></div><div id="productGrid" class="grid"></div></section>
<section id="cart" class="panel"><div class="toolbar"><h2>My Cart</h2></div><div id="cartList" class="admin-card"></div></section>
<section id="admin" class="panel"><div class="toolbar"><h2>Manage Products</h2><button class="icon" onclick="show('products')">×</button></div><div class="admin-card"><h3>Add New Product</h3><div class="row"><div><label>Product name</label><input id="pname" placeholder="e.g. Teddy Bear Favor"></div><div><label>Price (EGP)</label><input id="pprice" type="number" placeholder="45"></div></div><label>Description</label><textarea id="pdesc" placeholder="Short product description"></textarea><label>Product image</label><input id="pimg" type="file" accept="image/*"><button class="primary" onclick="addProduct()">Add Product</button></div><div class="admin-card" style="margin-top:16px"><h3>Current Products</h3><div id="adminList"></div></div></section>

let products=JSON.parse(localStorage.getItem('gittaProducts')||'null')||[
{id:1,name:'Teddy Bear Favor',price:45,img:imgs.teddy,desc:'A cute teddy bear favor for birthdays, baby showers and special occasions.'},
{id:2,name:'Gift Box',price:60,img:imgs.gift,desc:'Sweet pastel gift box for memorable little moments.'},
{id:3,name:'Elephant Candle Favor',price:50,img:imgs.elephant,desc:'Baby blue elephant candle favor.'},
{id:4,name:'Angel Favor',price:55,img:imgs.angel,desc:'Elegant angel favor for special occasions.'},
{id:5,name:'Cross Favor',price:50,img:imgs.cross,desc:'Delicate cross favor with floral details.'}];
let cart=JSON.parse(localStorage.getItem('gittaCart')||'[]');
function save(){localStorage.setItem('gittaProducts',JSON.stringify(products));localStorage.setItem('gittaCart',JSON.stringify(cart))}
function money(n){return 'EGP '+Number(n).toLocaleString()}
function card(p){return `<article class="card"><img src="${p.img}" alt=""><div class="body"><button class="heart" onclick="addCart(${p.id})">♡</button><b>${p.name}</b><div class="price">${money(p.price)}</div><small>${p.desc||''}</small></div></article>`}
function render(){document.getElementById('featured').innerHTML=products.slice(0,2).map(card).join('');document.getElementById('productGrid').innerHTML=products.map(card).join('');document.getElementById('adminList').innerHTML=products.map(p=>`<div class="product-row"><img src="${p.img}"><div style="flex:1"><b>${p.name}</b><br>${money(p.price)}</div><button onclick="removeProduct(${p.id})">Delete</button></div>`).join('');renderCart()}
function addCart(id){cart.push(id);save();renderCart();show('cart')}
function renderCart(){let counts={};cart.forEach(id=>counts[id]=(counts[id]||0)+1);let rows=Object.entries(counts).map(([id,q])=>{let p=products.find(x=>x.id==id);return p?`<div class="product-row"><img src="${p.img}"><div style="flex:1"><b>${p.name}</b><br>${money(p.price)} × ${q}</div><button onclick="cart=cart.filter(x=>x!=${id});save();render()">×</button></div>`:''}).join('');document.getElementById('cartList').innerHTML=rows||'<p>Your cart is empty.</p>'}
function removeProduct(id){products=products.filter(p=>p.id!==id);save();render()}
function addProduct(){let name=document.getElementById('pname').value.trim(),price=document.getElementById('pprice').value,img=document.getElementById('pimg').files[0],desc=document.getElementById('pdesc').value.trim();if(!name||!price)return alert('Enter product name and price.');let done=(src)=>{products.unshift({id:Date.now(),name,price:Number(price),img:src||imgs.gift,desc});save();render();document.getElementById('pname').value='';document.getElementById('pprice').value='';document.getElementById('pdesc').value='';document.getElementById('pimg').value='';alert('Product added successfully!')};if(img){let r=new FileReader();r.onload=()=>done(r.result);r.readAsDataURL(img)}else done()}
function show(id){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);render()}render();
</script></body></html>
